services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
      - ./hf_cache:/root/.cache/huggingface
    command: >
      --model /models/Qwen2.5-72B-Instruct
      --host 0.0.0.0
      --port 8000
      --dtype auto
      --gpu-memory-utilization 0.90

  agent:
    build: ./agent
    container_name: a2ui-agent
    environment:
      - OPENAI_BASE_URL=http://vllm:8000/v1
      - OPENAI_API_KEY=local-anything
      - OPENAI_MODEL=Qwen2.5-72B-Instruct
    ports:
      - "8080:8080"
    depends_on:
      - vllm